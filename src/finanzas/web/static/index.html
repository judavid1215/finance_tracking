<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanzas</title>
  <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
  <header>
    <select id="grupo" aria-label="Grupo"></select>
    <select id="instrumento" aria-label="Instrumento"></select>
    <button id="tema" type="button"></button>
  </header>

  <main>
    <section class="tarjetas" aria-live="polite">
      <div class="tarjeta"><span class="etiqueta">Valor</span><strong id="t-valor">–</strong></div>
      <div class="tarjeta"><span class="etiqueta">Ganancia</span><strong id="t-ganancia">–</strong></div>
      <div class="tarjeta"><span class="etiqueta">Rentab.</span><strong id="t-rentab">–</strong></div>
    </section>

    <p id="rango" class="rango"></p>
    <p id="aviso" class="aviso" hidden></p>

    <div class="vista" role="tablist" aria-label="Vista del gráfico">
      <button role="tab" data-vista="valor" aria-selected="true">Valor</button>
      <button role="tab" data-vista="rentabilidad" aria-selected="false">Rentabilidad %</button>
    </div>

    <div class="grafico">
      <canvas id="grafico"></canvas>
      <p id="mensaje" class="mensaje" hidden></p>
    </div>
  </main>

  <nav id="periodos" aria-label="Periodo"></nav>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
