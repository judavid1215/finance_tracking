# Desarrollo: código montado, recarga automática y debugpy en el puerto 5678.
name: finanzas-dev

services:
  app:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /data/db/finanzas.sqlite3
      # Los montajes desde Windows no siempre emiten eventos de inotify: polling = recarga fiable.
      WATCHFILES_FORCE_POLLING: "true"
    # debugpy en el proceso padre; con --reload los hijos se depuran vía subProcess (por defecto en VS Code).
    command:
      - python
      - -m
      - debugpy
      - --listen
      - 0.0.0.0:5678
      - -m
      - uvicorn
      - finanzas.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5678:5678"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml:ro
      - data:/data

volumes:
  data:
    name: finanzas_dev_data
