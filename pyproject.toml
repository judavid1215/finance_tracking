[project]
name = "finanzas"
version = "0.1.0"
description = "Seguimiento personal de inversiones"
requires-python = ">=3.12"
dependencies = ["yfinance>=0.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
